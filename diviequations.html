<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dividend Discount Model Reference Equations | CFA Institute</title>

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 1rem;
      color: #1f2937;
      background: #ffffff;
      padding: 1.25rem;
      line-height: 1.5;
    }

    .equation-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    .equation-row {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 1.5rem;
      align-items: center;
    }

    .equation-label {
      font-weight: 600;
      font-size: 0.9375rem;
      color: #374151;
    }

    .equation-label math {
      font-family: "STIX Two Math", "Cambria Math", "Latin Modern Math", serif;
      font-size: 1em;
    }

    .equation-display {
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      max-width: 100%;
    }

    .equation-display::-webkit-scrollbar {
      height: 6px;
    }

    .equation-display::-webkit-scrollbar-track {
      background: transparent;
    }

    .equation-display::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 3px;
    }

    .equation-display::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.3);
    }

    .equation-display math {
      font-family: "STIX Two Math", "Cambria Math", "Latin Modern Math", serif;
      font-size: 1.1rem;
      display: inline-block;
      min-width: max-content;
    }

    @media (max-width: 700px) {
      .equation-row {
        grid-template-columns: 1fr;
        gap: 0.5rem;
      }
    }

    @media (max-width: 640px) {
      .equation-display math {
        font-size: 0.95rem;
      }
    }

    @media (max-width: 480px) {
      .equation-display math {
        font-size: 0.85rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>

  <script type="text/x-mathjax-config">
    MathJax.Hub.Config({
      MathML: {
        extensions: ["content-mathml.js"]
      },
      "HTML-CSS": {
        scale: 95,
        linebreaks: { automatic: true }
      },
      showProcessingMessages: false,
      messageStyle: "none",
      menuSettings: { explorer: true },
      skipStartupTypeset: false
    });
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=MML_HTMLorMML"></script>
</head>
<body>
  <div class="equation-grid" aria-label="Reference equations for dividend discount models">

    <div class="equation-row">
      <div class="equation-label">Constant Dividend (Equation 10):</div>
      <div class="equation-display">
        <math xmlns="http://www.w3.org/1998/Math/MathML" display="block">
          <mrow>
            <msub>
              <mi mathcolor="#3c6ae5">PV</mi>
              <mi>t</mi>
            </msub>
            <mo>=</mo>
            <mfrac>
              <msub>
                <mi mathcolor="#b95b1d">Div</mi>
                <mrow>
                  <mi>t</mi>
                  <mo>+</mo>
                  <mn>1</mn>
                </mrow>
              </msub>
              <mi mathcolor="#7A46FF">r</mi>
            </mfrac>
          </mrow>
        </math>
      </div>
    </div>

    <div class="equation-row">
      <div class="equation-label">Constant Dividend Growth (Equation 14):</div>
      <div class="equation-display">
        <math xmlns="http://www.w3.org/1998/Math/MathML" display="block">
          <mrow>
            <msub>
              <mi mathcolor="#07514F">PV</mi>
              <mi>t</mi>
            </msub>
            <mo>=</mo>
            <mfrac>
              <mrow>
                <msub>
                  <mi mathcolor="#b95b1d">Div</mi>
                  <mi>t</mi>
                </msub>
                <mo>(</mo>
                <mn>1</mn>
                <mo>+</mo>
                <mi mathcolor="#07514F">g</mi>
                <mo>)</mo>
              </mrow>
              <mrow>
                <mi mathcolor="#7A46FF">r</mi>
                <mo>&#x2212;</mo>
                <mi mathcolor="#07514F">g</mi>
              </mrow>
            </mfrac>
            <mo>=</mo>
            <mfrac>
              <msub>
                <mi mathcolor="#b95b1d">Div</mi>
                <mrow>
                  <mi>t</mi>
                  <mo>+</mo>
                  <mn>1</mn>
                </mrow>
              </msub>
              <mrow>
                <mi mathcolor="#7A46FF">r</mi>
                <mo>&#x2212;</mo>
                <mi mathcolor="#07514F">g</mi>
              </mrow>
            </mfrac>
          </mrow>
        </math>
      </div>
    </div>

    <div class="equation-row">
      <div class="equation-label">Changing Dividend Growth (Equation 15):</div>
      <div class="equation-display">
        <math xmlns="http://www.w3.org/1998/Math/MathML" display="block">
          <mrow>
            <msub>
              <mi mathcolor="#7a46ff">PV</mi>
              <mn>0</mn>
            </msub>
            <mo>=</mo>
            <munderover>
              <mo>&#x2211;</mo>
              <mrow>
                <mi>i</mi>
                <mo>=</mo>
                <mn>1</mn>
              </mrow>
              <mi mathcolor="#3c6ae5">n</mi>
            </munderover>
            <mfrac>
              <mrow>
                <msub>
                  <mi mathcolor="#b95b1d">Div</mi>
                  <mi>t</mi>
                </msub>
                <msup>
                  <mrow>
                    <mo>(</mo>
                    <mn>1</mn>
                    <mo>+</mo>
                    <msub>
                      <mi mathcolor="#07514F">g</mi>
                      <mi>s</mi>
                    </msub>
                    <mo>)</mo>
                  </mrow>
                  <mi>i</mi>
                </msup>
              </mrow>
              <msup>
                <mrow>
                  <mo>(</mo>
                  <mn>1</mn>
                  <mo>+</mo>
                  <mi mathcolor="#7A46FF">r</mi>
                  <mo>)</mo>
                </mrow>
                <mi>i</mi>
              </msup>
            </mfrac>
            <mo>+</mo>
            <munderover>
              <mo>&#x2211;</mo>
              <mrow>
                <mi>j</mi>
                <mo>=</mo>
                <mrow>
                  <mi mathcolor="#3c6ae5">n</mi>
                  <mo>+</mo>
                  <mn>1</mn>
                </mrow>
              </mrow>
              <mo>&#x221E;</mo>
            </munderover>
            <mfrac>
              <mrow>
                <msub>
                  <mi mathcolor="#b95b1d">Div</mi>
                  <mrow>
                    <mi>t</mi>
                    <mo>+</mo>
                    <mi>n</mi>
                  </mrow>
                </msub>
                <msup>
                  <mrow>
                    <mo>(</mo>
                    <mn>1</mn>
                    <mo>+</mo>
                    <msub>
                      <mi mathcolor="#07514F">g</mi>
                      <mi>l</mi>
                    </msub>
                    <mo>)</mo>
                  </mrow>
                  <mi>j</mi>
                </msup>
              </mrow>
              <msup>
                <mrow>
                  <mo>(</mo>
                  <mn>1</mn>
                  <mo>+</mo>
                  <mi mathcolor="#7A46FF">r</mi>
                  <mo>)</mo>
                </mrow>
                <mi>j</mi>
              </msup>
            </mfrac>
          </mrow>
        </math>
      </div>
    </div>

  </div>
</body>
</html>
